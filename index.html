<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Beagle Chat</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230d1117'/%3E%3Cg fill='none' stroke='%233fb950' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m4.5 17 6-6-6-6'/%3E%3Cpath d='M12 18.5h7.5'/%3E%3C/g%3E%3C/svg%3E" />
<!-- JetBrains Mono, loaded so it can NEVER block the first paint.
     A plain <link rel=stylesheet> is render-blocking: the browser paints
     nothing at all until it resolves — not even the dark background set
     below. On a network that cannot reach fonts.googleapis.com (behind the
     GFW, captive portals, offline) that means a WHITE page for as long as the
     connection takes to time out, tens of seconds. React is vendored here for
     exactly that reason; this link was the one CDN left in the critical path.
     media="print" makes it non-blocking, and onload promotes it once it has
     actually arrived. The stack in `body` below is the fallback until then. -->
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: oklch(0.165 0.012 264);
    font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  #root { width: 100%; height: 100%; }
  #boot {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: #0b0b0f; color: #8d8b9a; z-index: 500;
  }
  .boot-brand { display: flex; align-items: center; gap: 9px; }
  .boot-mark { width: 18px; height: 18px; border-radius: 5px; background: #7c5cff; display: block; }
  .boot-word { font-size: 13px; color: #a8a5b6; }
  .boot-line { font-size: 13px; color: #6f6d7d; text-align: center; max-width: 320px; line-height: 1.6; padding: 0 20px; }
  .boot-reset {
    margin-top: 4px; padding: 9px 16px; border-radius: 9px; cursor: pointer;
    background: #1a1a22; border: 1px solid #2a2a35; color: #c9c6d6; font-size: 13px;
  }
  .boot-reset:hover { border-color: #7c5cff; color: #fff; }
  button { -webkit-tap-highlight-color: transparent; font-family: inherit; }
  input { font-family: inherit; }
  input::placeholder { color: var(--faint); }
  input:focus { border-color: var(--accent) !important; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-track { background: transparent; }
  .dk-md { white-space: normal; }
  .dk-md p { margin: 0; }
  .dk-md p + p, .dk-md p + ul, .dk-md p + ol, .dk-md p + pre,
  .dk-md ul + p, .dk-md ol + p, .dk-md pre + p,
  .dk-md h1 + p, .dk-md h2 + p, .dk-md h3 + p { margin-top: 0.5em; }
  .dk-md h1, .dk-md h2, .dk-md h3, .dk-md h4, .dk-md h5, .dk-md h6 {
    margin: 0 0 0.35em; font-size: 1em; line-height: 1.25; font-weight: 800;
  }
  .dk-md ul, .dk-md ol { margin: 0.25em 0; padding-left: 1.35em; }
  .dk-md li { margin: 0.15em 0; }
  .dk-md code { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 0.92em; background: rgba(0,0,0,0.18); border-radius: 4px; padding: 0.08em 0.3em; }
  .dk-md pre { margin: 0.45em 0 0; padding: 8px 10px; overflow: auto; border-radius: 8px; background: rgba(0,0,0,0.22); }
  .dk-md pre code { display: block; background: transparent; padding: 0; white-space: pre; }
  /* color:inherit is deliberate — the same rule has to read well on the dark
     incoming bubble AND on the accent-coloured outgoing one, where a blue link
     would clash. The affordance comes from the underline and the cursor. */
  .dk-md a { color: inherit; text-decoration: underline; text-underline-offset: 2px;
             cursor: pointer; overflow-wrap: anywhere; }
  .dk-md a:hover { text-decoration-thickness: 2px; opacity: 0.85; }
  @keyframes dkpulse { 0% { transform: scale(0.9); opacity: 0.7; } 70% { transform: scale(1.5); opacity: 0; } 100% { opacity: 0; } }
</style>
</head>
<body>
<div id="root"></div>

<!-- First paint, before a byte of JS runs.
     ~1.2MB of render-blocking script (290KB over the wire) stands between the
     navigation and React's first render, and anything that goes wrong in
     between — a slow link, a stale cache, a storage layer that will not
     answer — used to show as a black rectangle with no explanation. This is
     pure inline HTML and CSS: no script, no font, no request. It paints
     immediately, names itself, and after a few seconds starts saying what it
     is still waiting for. app.js removes it on mount. -->
<div id="boot">
  <div class="boot-brand"><span class="boot-mark"></span><span class="boot-word">beagle</span></div>
  <div class="boot-line" id="boot-line">starting…</div>
  <button class="boot-reset" id="boot-reset" type="button" hidden>Reset this browser&rsquo;s Beagle data</button>
</div>
<script>
(function () {
  // Deliberately tiny and inline: this has to work when everything else does
  // not. Escalates the message rather than spinning silently forever.
  var line = document.getElementById('boot-line');
  var reset = document.getElementById('boot-reset');
  var t0 = Date.now();
  var stages = [
    [3000, 'still loading\u2026'],
    [8000, 'this is slower than it should be \u2014 still fetching the app'],
    [20000, 'something is wrong. The app has not started.'],
  ];
  var timer = setInterval(function () {
    if (!document.getElementById('boot')) { clearInterval(timer); return; }
    var age = Date.now() - t0;
    for (var i = stages.length - 1; i >= 0; i--) {
      if (age >= stages[i][0]) { line.textContent = stages[i][1]; break; }
    }
    if (age >= 20000) reset.hidden = false;
  }, 1000);
  // Last resort for a browser whose storage is wedged: drop everything for
  // this origin and reload. It costs the identity, which is why it only
  // appears after twenty seconds of failure, and says so.
  reset.addEventListener('click', function () {
    if (!confirm('Delete this browser\u2019s Beagle identity and stored messages, then reload?\n\nAnything not backed up elsewhere is lost.')) return;
    try { localStorage.clear(); sessionStorage.clear(); } catch (e) {}
    var done = function () { location.reload(); };
    try {
      if (navigator.serviceWorker) {
        navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
      }
      var req = indexedDB.deleteDatabase('beagle-web');
      req.onsuccess = req.onerror = req.onblocked = done;
      setTimeout(done, 3000);
    } catch (e) { done(); }
  });
})();
</script>
<!-- Vendored React (no CDN — works offline / behind the GFW). -->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<!-- QR encoder (Kazuhiko Arase, MIT) — exposes window.qrcode for the QR-code button. -->
<script src="vendor/qrcode.js"></script>
<!-- peer-webrtc call engine (bundled IIFE) — exposes window.PeerWebRTC. -->
<script src="vendor/peer-webrtc.js"></script>
<!-- chat form schema (bundled IIFE) — exposes window.ChatComponents. The only
     place the format is interpreted; the backend just carries the message. -->
<script src="vendor/chat-components.js"></script>
<!-- The UI: @decentnetwork/beagle-ui plus this platform's host (src/ui/). -->
<!-- backend C: identity, storage, tab lock, /api interception. Must precede app.js. -->
<script>globalThis.__BEAGLE_BRIDGE__ = "wss://bridge.beagle.chat/relay-ws,wss://im.beagle.chat/relay-ws";</script>
<script src="beagle-web.js?v=78a1118ca3"></script>
<script src="app.js?v=18999fc06a"></script>
</body>
</html>
